<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <title>Audio and Video Player</title>
    <style>
        footer {
            background-color: #1e293b;
            color: #ffffff;
            text-align: center;
            padding: 15px 0;
            margin-top: 30px;
            font-family: Arial, sans-serif;
            border-radius: 8px;
        }

        footer a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>Audio and Video Player</h1>
    <section>
        <h2>Water Bridge and <em>Highway</em> Aerial View</h2>
        <video controls width="640" height="360" poster="../Images/waterbridge.jpg"
            style="aspect-ratio: 16/9; object-fit: cover;">
            <source src="../Videos-Audios/waterbridgeandhighway.mp4" type="video/mp4">
        </video>
        <figcaption>Experience the <em>incredible</em> water bridge where boats sail directly over highway traffic.
        </figcaption>
    </section>

    <section>
        <h2>Sport - Sport <em>Rock</em> Music</h2>
        <audio controls>
            <source src="../Videos-Audios/sportsrockmusic.mp3" type="audio/mpeg" />
            Your browser does not support the audio element.
        </audio>
        <p><a href="https://pixabay.com/users/lnplusmusic-47631836/" target="_blank" style="color:#000">INPLUSMUSIC</a>
        </p>
    </section>

    <section>
        <h2>Tense - <em>Suspense</em> Background Music</h2>
        <audio controls>
            <source src="../Videos-Audios/suspenseaudio.mp3" type="audio/mpeg" />
            your browser does not support the audio element.
        </audio>
        <p> <a href="https://pixabay.com/users/sigmamusicart-36860929/" target="_blank"
                style="color:#000"><em>SigmaMusicArt</em></a></p>
    </section>
    <p>For more audios visit <a href="https://pixabay.com/music/" target="_blank"
            style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; text-decoration: none; color: #000">Pixabay</a>
    </p>
    <main>
        <footer>
            <p>Coded by <strong><em>Zohaib</em></strong> | <a href="https://github.com/hezohaib" target="_blank">GitHub
                    Profile</a></p>
        </footer>
    </main>
</body>

</html>
